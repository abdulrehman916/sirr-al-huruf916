name: Apply verified independence repairs
on:
  push:
    branches: [main]
    paths: [.github/workflows/independence-repair.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    if: github.repository_id == '1407942113'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
      - name: Verify expected parent
        run: test "$(git rev-parse HEAD^)" = a08e17805022b4d7d374265a695d12e4b0ff2f2e
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Apply reviewed patch
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import gzip,base64,hashlib,subprocess
          patch=gzip.decompress(base64.b64decode(
