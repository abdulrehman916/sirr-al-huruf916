      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run verify:calculations
      - run: npm run verify:calculation-source
      - run: npm run verify:calculation-regression
      - run: npm run verify:async-calculation
      - run: npm run verify:records
      - run: npm run verify:private-references
      - run: npm run verify:independence
      - run: npm run build
      - name: Commit verified application repairs
        run: |
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Preserve original calculations and bilingual displays; preserve durable references when editing cards"
          git push origin HEAD:main
