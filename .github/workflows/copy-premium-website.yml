name: Copy premium website
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: copy-premium-website
  cancel-in-progress: false
jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Fetch and verify source snapshot
        shell: bash
        run: |
          set -euo pipefail
          target_sha=$(git rev-parse HEAD)
          git remote add migration-source https://github.com/abdulrehman916/sirr-al-huruf.git
          git fetch --no-tags migration-source refs/heads/premium-website
          source_sha=$(git rev-parse FETCH_HEAD)
          test "$source_sha" = "99c504225ecf5d524ae4632785b9ac3c2e4095b2"
          git read-tree --reset -u "$source_sha"
          git rm -f --ignore-unmatch .github/workflows/premium-website-checks.yml
          git checkout "$target_sha" -- .github/workflows/copy-premium-website.yml
          git diff --exit-code "$source_sha" -- . ':(exclude).github/workflows'
          echo "Verified source: $source_sha" >> "$GITHUB_STEP_SUMMARY"
          echo "Source files: $(git ls-tree -r --name-only "$source_sha" | wc -l)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and build
        run: |
          npm ci
          npm run build
      - name: Publish verified snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Import premium website snapshot from sirr-al-huruf"
          git push origin HEAD:refs/heads/main
          echo "Imported files: $(git ls-tree -r --name-only HEAD | wc -l)" >> "$GITHUB_STEP_SUMMARY"
