name: Premium website checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify locked calculation core
        run: npm run verify:calculations
      - name: Verify record relationships and private references
        run: npm run verify:records && npm run verify:private-references && npm run verify:independence
      - name: Verify independent account read isolation
        run: node scripts/verify-independent-read-api.mjs
      - name: Lint source
        run: npm run lint
      - name: Compare source calculation outputs
        run: npm run verify:calculation-source && npm run verify:calculation-regression && npm run verify:async-calculation
      - name: Build production bundle
        run: npm run build
